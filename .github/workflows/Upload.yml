name: Upload install scripts
on:
  push:
  pull_request:

jobs:
  test-unix:
    strategy:
      matrix:
        os: [ubuntu-slim, macos-latest]
        version: [stable, staged, pinned]
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.version }} ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Test staged Unix install
      if: matrix.version == 'staged'
      shell: sh
      run: |
        DUCKDB_STAGED=c99ade5cb6/v2.0.0-alpha38367 sh install.sh
        ALPHA_INST="$HOME/.duckdb/cli/2.0.0-alpha38367"
        test -x "$ALPHA_INST/duckdb"
        test "$(readlink ~/.duckdb/cli/latest)" = "$ALPHA_INST"
        ~/.duckdb/cli/latest/duckdb -c "select 42"

    - name: Test stable Unix install
      if: matrix.version != 'pinned'
      shell: sh
      run: |
        cat install.sh | sh
        ~/.duckdb/cli/latest/duckdb -c "select 42"

    - name: Test pinned Unix install
      if: matrix.version == 'pinned'
      shell: sh
      run: |
        DUCKDB_VERSION=1.5.5 sh install.sh
        PINNED_INST="$HOME/.duckdb/cli/1.5.5"
        test -x "$PINNED_INST/duckdb"
        test "$("$PINNED_INST/duckdb" -noheader -init /dev/null -csv -batch -s "SELECT version()")" = "v1.5.5"
        "$PINNED_INST/duckdb" -c "select 42"

    - name: Test Unix libraries
      if: matrix.version != 'pinned'
      shell: sh
      env:
        TEST_VERSION: ${{ matrix.version }}
      run: |
        export HOME="$RUNNER_TEMP/duckdb-library-home"
        mkdir -p "$HOME"

        install_libraries() {
          if [ "$TEST_VERSION" = "staged" ]; then
            DUCKDB_INSTALL=static,shared DUCKDB_STAGED=c99ade5cb6/v2.0.0-alpha38367 sh install.sh
          else
            DUCKDB_INSTALL=static,shared sh install.sh
          fi
        }

        install_libraries
        test ! -e "$HOME/.duckdb/cli"

        if [ "$TEST_VERSION" = "staged" ]; then
          LIB_INST="$HOME/.duckdb/lib/2.0.0-alpha38367"
          test "$(readlink "$HOME/.duckdb/lib/latest")" = "$LIB_INST"
        else
          LIB_INST="$HOME/.duckdb/lib/latest"
          test -L "$LIB_INST"
        fi

        test -s "$LIB_INST/duckdb.h"
        test -s "$LIB_INST/libduckdb_static.a"
        if [ "$(uname -s)" = "Darwin" ]; then
          test -s "$LIB_INST/libduckdb.dylib"
        else
          test -s "$LIB_INST/libduckdb.so"
        fi

  test-windows:
    strategy:
      matrix:
        version: [stable, staged, pinned]
    runs-on: windows-latest
    name: Test ${{ matrix.version }} windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Test stable Windows install
      if: matrix.version == 'stable'
      shell: pwsh
      run: |
        ./install.ps1
        $sh = New-Object -ComObject WScript.Shell
        $target = $sh.CreateShortcut("$Home\Desktop\DuckDB.lnk").TargetPath
        & $target -c "select 42"

    - name: Test staged Windows install
      if: matrix.version == 'staged'
      shell: pwsh
      run: |
        $env:DUCKDB_STAGED = "c99ade5cb6/v2.0.0-alpha38367"
        ./install.ps1
        & "$env:LOCALAPPDATA\duckdb\cli\2.0.0-alpha38367\duckdb.exe" -c "select 42"

    - name: Test pinned Windows install
      if: matrix.version == 'pinned'
      shell: pwsh
      run: |
        $env:DUCKDB_VERSION = "1.5.5"
        ./install.ps1
        & "$env:LOCALAPPDATA\duckdb\cli\1.5.5\duckdb.exe" -c "select 42"

    - name: Test Windows libraries
      if: matrix.version != 'pinned'
      shell: pwsh
      env:
        TEST_VERSION: ${{ matrix.version }}
      run: |
        $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "duckdb-library-appdata"
        $env:DUCKDB_INSTALL = "static,shared"
        if ($env:TEST_VERSION -eq "staged") {
          $env:DUCKDB_STAGED = "c99ade5cb6/v2.0.0-alpha38367"
          $version = "2.0.0-alpha38367"
        } else {
          $version = (iwr "https://duckdb.org/data/latest_stable_version.txt").Content.Trim()
        }

        ./install.ps1
        if (Test-Path "$env:LOCALAPPDATA\duckdb\cli") {
          throw "A library-only install unexpectedly created the CLI directory."
        }

        $lib = "$env:LOCALAPPDATA\duckdb\lib\$version"
        foreach ($file in @("duckdb.h", "duckdb_static.lib", "duckdb.dll", "duckdb.lib")) {
          if (-not (Test-Path "$lib\$file" -PathType Leaf)) {
            throw "Missing $lib\$file"
          }
        }

  test-musl:
    strategy:
      matrix:
        version: [stable, staged, pinned]
    runs-on: ubuntu-latest
    container: alpine:3.22
    name: Test ${{ matrix.version }} alpine-3.22
    steps:
    - uses: actions/checkout@v7

    - name: Setup
      run: apk add --no-cache curl libstdc++

    - name: Test musl install
      env:
        TEST_VERSION: ${{ matrix.version }}
      run: |
        if [ "$TEST_VERSION" = "staged" ]; then
          DUCKDB_STAGED=c99ade5cb6/v2.0.0-alpha38367 sh install.sh
          test -x "$HOME/.duckdb/cli/2.0.0-alpha38367/duckdb"
          "$HOME/.duckdb/cli/latest/duckdb" -c "select 42"
        elif [ "$TEST_VERSION" = "pinned" ]; then
          DUCKDB_VERSION=1.5.5 sh install.sh
          "$HOME/.duckdb/cli/1.5.5/duckdb" -c "select 42"
        else
          sh install.sh
          "$HOME/.duckdb/cli/latest/duckdb" -c "select 42"
        fi

  test-debian:
    strategy:
      matrix:
        version: [stable, staged, pinned]
    runs-on: ubuntu-latest
    container: debian:12
    name: Test ${{ matrix.version }} debian-12
    steps:
    - name: Setup
      run: |
        apt-get update
        apt-get install --yes --no-install-recommends ca-certificates curl git gzip tar

    - uses: actions/checkout@v7

    - name: Test glibc install
      env:
        TEST_VERSION: ${{ matrix.version }}
      run: |
        if ldd --version 2>&1 | grep -qi musl; then
          echo "Expected a glibc environment." >&2
          exit 1
        fi

        if [ "$TEST_VERSION" = "staged" ]; then
          DUCKDB_STAGED=c99ade5cb6/v2.0.0-alpha38367 sh install.sh
          test -x "$HOME/.duckdb/cli/2.0.0-alpha38367/duckdb"
          "$HOME/.duckdb/cli/latest/duckdb" -c "select 42"
        elif [ "$TEST_VERSION" = "pinned" ]; then
          DUCKDB_VERSION=1.5.5 sh install.sh
          "$HOME/.duckdb/cli/1.5.5/duckdb" -c "select 42"
        else
          sh install.sh
          "$HOME/.duckdb/cli/latest/duckdb" -c "select 42"
        fi

  upload:
    needs: [test-unix, test-windows, test-musl, test-debian]
    runs-on: ubuntu-slim
    if: github.repository == 'duckdb/duckdb-install-scripts' && github.ref_name == 'main'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        shell: bash
        run: pip install awscli

      - name: Upload
        env:
          AWS_ENDPOINT_URL: ${{ secrets.DUCKDB_INSTALL_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DUCKDB_INSTALL_S3_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DUCKDB_INSTALL_S3_SECRET }}

        shell: bash
        run: |
          aws s3 cp install.sh s3://duckdb-install/
          aws s3 cp install.ps1 s3://duckdb-install/
